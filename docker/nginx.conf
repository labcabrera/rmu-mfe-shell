# Serves the shell at the root of the origin. Unknown paths fall back to index.html so the
# React router handles them (/core/..., /strategic/...), and index.html and env-config.js are
# revalidated (ETag). The chunks carry the hash of their content, and can be cached for good.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Workspace spec 091, E5: the name of a chunk carries the hash of its content.
  location ~ "\.[0-9a-f]{20}\.js$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
