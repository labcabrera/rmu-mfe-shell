# Serves the shell at the root of the origin. Unknown paths fall back to index.html so the
# React router handles them (/core/..., /strategic/...). Chunk names carry no content hash yet,
# so every file is revalidated (ETag) instead of being cached as immutable.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
